button{cursor:pointer;background:none;border:0}
.stage{min-height:100%;display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:24px 16px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;border:10px solid #111;position:relative;overflow:hidden;flex:none;box-shadow:0 20px 60px rgba(60,40,10,.25);display:flex;flex-direction:column}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-weight:800;font-size:15px}
.statusbar .sb-r{display:flex;gap:6px;align-items:center;font-size:12px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}
.pad{padding:8px 20px 28px}
/* top bar */
.topbar{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;min-height:52px;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar h1{font-size:19px;font-weight:800;flex:1;line-height:1.2}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--line)}
.iconbtn svg,.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* tabbar */
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 4px 22px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-3);padding:6px 0;min-height:52px;position:relative}
.tab .ic{width:24px;height:24px}
.tab.on{color:var(--ink)}
.tab.on::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:4px;border-radius:0 0 4px 4px;background:var(--sun)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 18px);width:10px;height:10px;border-radius:50%;background:var(--err);border:2px solid var(--surface)}
/* type */
.h-xl{font-size:28px;font-weight:900;line-height:1.15}
.h-l{font-size:22px;font-weight:800;line-height:1.2}
.h-m{font-size:17px;font-weight:800}
.h-s{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
p{line-height:1.45}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r-md);font-weight:800;font-size:16px;padding:0 18px;border:2px solid var(--ink)}
.btn-primary{background:var(--sun);border-color:var(--ink)}
.btn-primary:active{background:#E9A91B}
.btn-secondary{background:var(--surface)}
.btn-ghost{border-color:transparent;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.btn-danger{background:var(--surface);border-color:var(--err);color:var(--err)}
.btn-sm{min-height:40px;font-size:14px;width:auto;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.45}
.link{font-weight:800;text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
/* forms */
.field{margin-top:16px}
.field label{display:block;font-weight:800;font-size:14px;margin-bottom:6px}
.input{width:100%;min-height:52px;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:0 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--ink)}
.input.bad{border-color:var(--err);background:#FFF8F7}
.hint{font-size:13px;color:var(--ink-2);margin-top:6px}
.errtxt{font-size:14px;color:var(--err);margin-top:6px;font-weight:700;display:flex;gap:6px;align-items:flex-start}
.alert{border-radius:var(--r-md);padding:14px;display:flex;gap:12px;align-items:flex-start;border:2px solid}
.alert-err{background:var(--err-bg);border-color:var(--err)}
.alert-warn{background:var(--warn-bg);border-color:var(--orange)}
.alert-ok{background:var(--ok-bg);border-color:var(--ok)}
.alert-info{background:var(--rain-bg);border-color:var(--rain)}
.alert .ai{font-size:22px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:var(--r-pill);border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--ink);background:var(--sun-200)}
.seg{display:flex;border:2px solid var(--ink);border-radius:var(--r-md);overflow:hidden}
.seg button{flex:1;min-height:48px;font-weight:800}
.seg button.on{background:var(--sun)}
.seg button+button{border-left:2px solid var(--ink)}
.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:var(--r-md);background:var(--surface);width:max-content}
.stepper button{width:52px;height:52px;font-size:24px;font-weight:800}
.stepper span{min-width:44px;text-align:center;font-weight:900;font-size:18px}
.toggle{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.switch{width:52px;height:32px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--ink)}
.switch.on::after{left:23px;background:var(--sun)}
/* cards */
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.tap{width:100%;text-align:left;display:block}
.card.tap:active{background:var(--sun-100)}
.stack>*+*{margin-top:12px}
.progress{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .3s}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-err{background:var(--err-bg);color:var(--err)}
.b-warn{background:var(--warn-bg);color:var(--orange-ink)}
.b-sun{background:var(--sun-200);color:var(--ink)}
.b-grey{background:#EFEAE1;color:var(--ink-2)}
.b-rain{background:var(--rain-bg);color:var(--rain)}
/* weather */
.wx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.wx::-webkit-scrollbar{display:none}
.wxd{flex:1;min-width:52px;text-align:center;border-radius:var(--r-md);padding:10px 4px;background:var(--surface);border:1.5px solid var(--line)}
.wxd.rain{background:var(--rain-bg);border-color:#BCD3E6}
.wxd .e{font-size:24px;margin:4px 0}
.wxd b{font-size:15px}
/* checklist */
.cat{margin-top:18px}
.cathead{display:flex;align-items:center;gap:8px;min-height:44px;width:100%;text-align:left}
.cathead .ct{font-weight:900;font-size:17px;flex:1}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:8px 4px 8px 10px;margin-top:8px;min-height:60px}
.item.packed{background:#F6F3EC}
.item.packed .iname{text-decoration:line-through;color:var(--ink-3)}
.cb{width:32px;height:32px;border-radius:9px;border:2.5px solid var(--ink);flex:none;display:grid;place-items:center;background:var(--surface);margin:-6px;padding:6px;box-sizing:content-box;background-clip:content-box}
.cb.on{background:var(--sun) content-box}
.cb svg{width:20px;height:20px;stroke:var(--ink);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.iname{font-weight:800;font-size:16px;line-height:1.25}
.iqty{font-size:13px;color:var(--ink-2);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--sun-100);border:1px solid var(--sun-200);color:#6B4A07}
.tag.t-rain{background:var(--rain-bg);border-color:#BCD3E6;color:var(--rain)}
.tag.t-hist{background:#EFEAE1;border-color:#E2DACB;color:var(--ink-2)}
.tag.t-new{background:var(--ink);color:var(--sun);border-color:var(--ink)}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--sun-200);border-color:var(--orange)}100%{}}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.filters .chip{white-space:nowrap;flex:none}
.filters::-webkit-scrollbar{display:none}
.fab{position:sticky;bottom:16px;margin:20px 0 0 auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--sun);font-weight:900;border-radius:var(--r-pill);padding:0 20px 0 16px;min-height:56px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:4}
.fab .ic{stroke:var(--sun)}
/* agenda */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 10px;margin:0 -20px}
.days::-webkit-scrollbar{display:none}
.day{min-width:62px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--surface);padding:8px 4px;text-align:center;flex:none}
.day.on{border-color:var(--ink);background:var(--sun-200)}
.day .dw{font-size:12px;font-weight:800;color:var(--ink-2);text-transform:uppercase}
.day .dn{font-size:20px;font-weight:900}
.day .de{font-size:16px}
.ev{display:flex;gap:12px;margin-top:12px}
.ev .time{width:48px;flex:none;font-weight:800;font-size:14px;padding-top:14px;text-align:right}
.ev .time small{display:block;font-weight:700;color:var(--ink-3);font-size:12px}
.evc{flex:1;border-radius:var(--r-md);padding:12px 14px;background:var(--surface);border:2px solid var(--ink)}
.evc.sug{border:2px dashed var(--orange);background:var(--sun-100)}
.evc.plan{border-color:var(--ink);background:var(--surface)}
.evc.own{border-color:var(--rain);background:#F4F8FC}
.evc .et{font-weight:900;font-size:16px}
.evc .ep{font-size:13px;color:var(--ink-2);font-weight:700;margin-top:2px}
.evc .eacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* sheet + modal + toast */
.scrim{position:absolute;inset:0;background:rgba(26,23,20,.45);z-index:40;display:flex;align-items:flex-end;animation:fade .15s}
.scrim.center{align-items:center;padding:24px}
.sheet{background:var(--bg);width:100%;border-radius:26px 26px 0 0;max-height:88%;overflow-y:auto;padding:10px 20px 30px;animation:up .2s ease}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.modal{background:var(--bg);border-radius:var(--r-lg);padding:22px;width:100%;animation:pop .18s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{from{transform:scale(.94);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:14px;right:14px;bottom:96px;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:60;font-weight:700;font-size:15px;animation:up .2s ease;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast .ti{color:var(--sun);font-size:18px}
.toast button{color:var(--sun);font-weight:900;text-decoration:underline;min-height:36px;padding:0 4px;white-space:nowrap}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;font-weight:800;font-size:16px;border-bottom:1px solid var(--line);text-align:left}
.menu button:last-child{border-bottom:0}
.menu .mi{font-size:20px;width:28px;text-align:center}
/* misc */
.splash{min-height:100%;display:flex;flex-direction:column;padding:24px 24px 30px;background:radial-gradient(circle at 50% 30%,var(--sun-100) 0,var(--bg) 60%)}
.splash img{width:230px;margin:30px auto 0;display:block}
.empty{text-align:center;padding:40px 16px}
.empty .ee{font-size:48px}
.spinner{width:56px;height:56px;border-radius:50%;border:6px solid var(--sun-200);border-top-color:var(--orange);animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:flex;gap:6px;margin:4px 0 4px}
.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--orange)}
.suggest{border:2px solid var(--ink);border-radius:var(--r-md);background:var(--surface);margin-top:6px;overflow:hidden}
.suggest button{display:block;width:100%;text-align:left;padding:12px 14px;min-height:48px;font-weight:700;border-bottom:1px solid var(--line)}
.suggest button:last-child{border-bottom:0}
.doc{display:flex;gap:14px;align-items:center}
.docico{width:52px;height:40px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-size:20px;background:var(--sun-100);flex:none}
.check-row{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.check-row:last-child{border-bottom:0}
.ci{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex:none;color:#fff}
.ci.ok{background:var(--ok)}.ci.bad{background:var(--err)}.ci.warn{background:var(--orange)}.ci.na{background:var(--ink-3)}
ol.howto{padding-left:0;list-style:none;counter-reset:s}
ol.howto li{counter-increment:s;display:flex;gap:12px;margin-top:14px;line-height:1.45}
ol.howto li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;flex:none;font-size:14px}
.tripsw{display:flex;align-items:center;gap:6px;font-weight:900;font-size:22px;min-height:44px}
.insight{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:16px}
.insight b{color:var(--sun)}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--sun);border:2.5px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:24px}
/* facilitator panel */
.panel{width:330px;flex:none;background:#fff;border-radius:18px;padding:18px;font-size:14px;box-shadow:0 8px 30px rgba(60,40,10,.12);position:sticky;top:24px}
.panel h2{font-size:16px;font-weight:900}
.panel .pt{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.panel .pt b{display:block}
.panel .pt span{color:var(--ink-2);font-size:13px;line-height:1.35;display:block;margin-top:2px}
.panel .go{border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-weight:800;background:var(--sun);flex:none;font-size:13px}
.panel .reset{margin-top:12px;width:100%;border:2px solid var(--ink);border-radius:10px;min-height:40px;font-weight:800}
.panel .logo{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.panel .logo img{width:40px;height:40px;border-radius:10px;border:1px solid var(--line)}
@media (max-width:760px){
  .panel{display:none}
  .stage{padding:0}
  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none}
  .tabbar{padding-bottom:max(8px,env(safe-area-inset-bottom))}
}

const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DSEM = ['dom','seg','ter','qua','qui','sex','sáb'];
const DSEML = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const D = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const TODAY_ISO = iso(TODAY);
const addDays = (s,n) => { const d = D(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a,b) => Math.round((D(b)-D(a))/864e5);
const fmt = s => { const d = D(s); return d.getDate()+' '+MES[d.getMonth()]; };
const fmtY = s => { const d = D(s); return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear(); };
const fmtRange = (a,b) => { const x=D(a), y=D(b); if (x.getMonth()===y.getMonth() && x.getFullYear()===y.getFullYear()) return x.getDate()+'–'+y.getDate()+' '+MES[x.getMonth()]; return fmt(a)+' – '+fmt(b)+(x.getFullYear()!==y.getFullYear()?' '+y.getFullYear():''); };
const daysOf = t => { const n = diffDays(t.start,t.end)+1; return Array.from({length:n},(_,i)=>addDays(t.start,i)); };
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fromMin = m => String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

/* ---- weather ---- */
const FUNCHAL_WX = {
  '2026-10-12':{e:'☀️', t:'Sol', max:27, min:20},
  '2026-10-13':{e:'☀️', t:'Sol', max:26, min:19},
  '2026-10-14':{e:'🌧️', t:'Chuva', max:22, min:18, rain:true, p:80},
  '2026-10-15':{e:'☀️', t:'Sol', max:25, min:19},
  '2026-10-16':{e:'☀️', t:'Sol', max:24, min:18},
};
function forecast(t){
  const until = diffDays(TODAY_ISO, t.start);
  if (until > 10 || diffDays(TODAY_ISO, t.end) < 0) return null;
  return daysOf(t).filter(d => diffDays(TODAY_ISO,d) <= 10).map(d => {
    if (t.dest==='funchal' && FUNCHAL_WX[d]) return {d, ...FUNCHAL_WX[d]};
    const h = (D(d).getDate()*7 + t.dest.length*3) % 10;
    const base = {porto:19, lisboa:22, algarve:23, oslo:7, londres:14, paris:15, madrid:20}[t.dest] ?? 20;
    if (h===3) return {d, e:'🌧️', t:'Chuva', max:base-3, min:base-8, rain:true, p:70};
    return {d, e: h%3===0?'⛅':'☀️', t: h%3===0?'Nuvens':'Sol', max: base+(h%3), min: base-6};
  });
}
const wxForDay = (t, d) => (forecast(t)||[]).find(f=>f.d===d);

function qtyTxt(t, x){ if (!x) return ''; return t.travellers>1 ? x+' por pessoa' : '×'+x; }

function genItems(t, profile, history){
  const dest = destById(t.dest) || {};
  const n = diffDays(t.start,t.end)+1;
  const fc = forecast(t);
  const maxT = fc ? Math.max(...fc.map(f=>f.max)) : null;
  const minT = fc ? Math.min(...fc.map(f=>f.min)) : null;
  const rainDay = fc && fc.find(f=>f.rain);
  const hist = history && history.length>0;
  const L = [];
  const add = (cat, name, qty='', tags=[]) => {
    const ex = L.find(i => i.name===name);
    if (ex) { tags.forEach(tg => { if (!ex.tags.some(x=>x.t===tg.t)) ex.tags.push(tg); }); return ex; }
    const it = {id:uid('i'), cat, name, qty, tags:[...tags], packed:false, buyLater:false};
    L.push(it); return it;
  };
  const q = x => qtyTxt(t,x);
  // Documentos
  add('Documentos','Cartão de Cidadão ou passaporte', t.travellers>1?'1 por pessoa':'');
  if (dest.air) add('Documentos','Cartões de embarque (no telemóvel)','',[{k:'act',t:'✈️ voo'}]);
  add('Documentos','Reserva do alojamento');
  add('Documentos','Cartão bancário e algum dinheiro');
  if (dest.abroad) add('Documentos','Cartão Europeu de Seguro de Doença');
  // Roupa
  add('Roupa','Roupa interior',q(n+1));
  add('Roupa','Meias',q(n+1));
  add('Roupa', t.purpose==='trabalho'?'T-shirts / polos':'T-shirts', q(n));
  if (hist && n>2) add('Roupa','Calças / calções',q(Math.max(1,Math.ceil(n/2)-1)),[{k:'hist',t:'🕘 levaste a mais em Sevilha'}]);
  else add('Roupa','Calças / calções',q(Math.max(1,Math.ceil(n/2))));
  add('Roupa','Pijama',q(1));
  add('Roupa','Casaco leve para a noite',q(1), fc?[{k:'wx',t:'🌙 noites a '+minT+'°C'}]:[]);
  if (rainDay) add('Roupa','Casaco impermeável',q(1),[{k:'rain',t:'🌧️ chuva a '+fmt(rainDay.d)}]);
  // Calçado
  add('Calçado','Ténis confortáveis',q(1));
  // Higiene
  add('Higiene','Escova de dentes', t.travellers>1?'1 por pessoa':'');
  add('Higiene','Pasta de dentes');
  add('Higiene','Desodorizante');
  add('Higiene','Champô e gel de banho (tamanho viagem)');
  add('Higiene','Escova ou pente');
  // Saúde
  if (profile.meds) add('Saúde','Medicação habitual','para '+n+' dias + 2 extra',[{k:'prof',t:'👤 do teu perfil'}]);
  if (profile.glasses) add('Saúde','Óculos / lentes e estojo','',[{k:'prof',t:'👤 do teu perfil'}]);
  add('Saúde','Paracetamol');
  add('Saúde','Pensos rápidos');
  // Eletrónica
  add('Eletrónica','Carregador do telemóvel','', hist?[{k:'hist',t:'🕘 esquecido em 2 viagens'}]:[]);
  add('Eletrónica','Power bank');
  add('Eletrónica','Auriculares');
  if (dest.plug) add('Eletrónica','Adaptador de tomada (tipo '+dest.plug+')','', hist?[{k:'hist',t:'🕘 esquecido em Londres'}]:[{k:'wx',t:'🔌 tomadas tipo '+dest.plug}]);
  // Tempo
  if (maxT !== null && maxT >= 23) {
    const tg = {k:'wx', t:'☀️ previsão: '+maxT+'°C'};
    add('Saúde','Protetor solar FPS 50','',[tg]);
    add('Outros','Óculos de sol','',[tg]);
    add('Roupa','Chapéu ou boné',q(1),[tg]);
  }
  // Crianças
  if (t.children>0) {
    const k = {k:'act', t:'🧒 '+t.children+(t.children>1?' crianças':' criança')};
    add('Saúde','Protetor solar infantil','',[k]);
    add('Outros','Snacks e água para a viagem','',[k]);
    add('Outros','Jogos ou livros para as crianças','',[k]);
    add('Saúde','Termómetro e antipirético infantil','',[k]);
  }
  // Atividades
  (t.acts||[]).forEach(a => {
    const A = ACTS[a];
    (ACT_ITEMS[a]||[]).forEach(([cat,name,qq,why]) => {
      const tag = {k:'act', t:A.e+' '+A.label.toLowerCase()+(why && t.dest==='funchal'?' · '+why:'')};
      add(cat, name, qq==='n'?q(n):q(qq), [tag]);
    });
  });
  return L;
}

const ACT_SLOT = {
  caminhada:['09:30','13:00','Caminhada'], praia:['10:30','16:00','Dia de praia'], jantar:['20:00','22:30','Jantar fora'],
  reuniao:['10:00','13:00','Reunião'], cultura:['10:00','12:30','Visita a museu'], desporto:['17:00','18:30','Desporto'],
  parque:['10:00','18:00','Parque temático'], noite:['22:00','23:59','Sair à noite'],

function genEvents(t){
  const days = daysOf(t);
  const ev = [];
  const fc = forecast(t);
  const bestDays = days.filter(d => !(fc && (fc.find(f=>f.d===d)||{}).rain));
  const pick = i => (bestDays.length?bestDays:days)[Math.min(i+ (bestDays.length>2?1:0), (bestDays.length?bestDays:days).length-1)];
  const P = (o) => ev.push({id:uid('e'), type:'plan', status:'ok', items:[], ...o});
  const S = (o) => ev.push({id:uid('e'), type:'sug', status:'pending', items:[], ...o});
  if (t.dest==='funchal') {
    const acts = t.acts||[];
    if (acts.includes('caminhada')) P({day:'2026-10-13', start:'09:30', end:'13:00', title:'Levada dos Balcões', place:'Ribeiro Frio · 40 min de carro', e:'🥾', fit:'☀️ 26°C, sem chuva'});
    if (acts.includes('praia')) P({day:'2026-10-15', start:'10:30', end:'16:00', title:'Dia de praia', place:'Praia Formosa', e:'🏖️', fit:'☀️ 25°C, mar calmo'});
    if (acts.includes('jantar')) P({day:'2026-10-15', start:'20:00', end:'22:30', title:'Jantar fora', place:'Zona Velha do Funchal', e:'🍽️'});
    acts.filter(a=>!['caminhada','praia','jantar'].includes(a)).forEach((a,i)=>{ const s=ACT_SLOT[a]; P({day:'2026-10-16', start:s[0], end:s[1], title:s[2], place:'Funchal', e:ACTS[a].e}); });
    S({day:'2026-10-12', start:'15:30', end:'18:00', title:'Passeio de barco: golfinhos e baleias', place:'Marina do Funchal', e:'🐬', fit:'☀️ 27°C · mar calmo',
       items:[['Saúde','Comprimidos para o enjoo',''],['Roupa','Corta-vento',1],['Eletrónica','Bolsa estanque para o telemóvel','']]});
    S({day:'2026-10-13', start:'16:00', end:'18:30', title:'Teleférico ao Monte e Jardim Tropical', place:'Funchal → Monte', e:'🚡', fit:'☀️ 26°C, boa visibilidade', items:[]});
    S({day:'2026-10-14', start:'10:30', end:'12:30', title:'Madeira Story Centre', place:'Espaço interior · Zona Velha', e:'🏛️', fit:'🌧️ dia de chuva → atividade interior', rain:true,
       items:[['Outros','Guarda-chuva compacto','']]});
    S({day:'2026-10-14', start:'15:00', end:'16:30', title:"Prova de vinhos na Blandy's Wine Lodge", place:'Espaço interior · centro', e:'🍷', fit:'🌧️ dia de chuva → atividade interior', rain:true, items:[]});
    S({day:'2026-10-16', start:'09:30', end:'11:00', title:'Mercado dos Lavradores', place:'Centro do Funchal', e:'🧺', fit:'☀️ 24°C', items:[['Outros','Saco reutilizável para compras','']]});
    return ev;
  }
  const dname = (destById(t.dest)||{}).name || t.destName;
  (t.acts||[]).forEach((a,i) => { const s = ACT_SLOT[a]; P({day: pick(i), start:s[0], end:s[1], title: a==='reuniao'?'Reunião com cliente':s[2], place: a==='reuniao'?'Escritório do cliente':dname, e:ACTS[a].e}); });
  if (t.dest==='porto') {
    S({day:t.start, start:'19:00', end:'20:30', title:'Caves do Vinho do Porto', place:'Vila Nova de Gaia', e:'🍷', fit:'Perto do hotel', items:[]});
    S({day:t.end, start:'08:00', end:'09:00', title:'Pequeno-almoço no Majestic', place:'Rua de Santa Catarina', e:'☕', items:[]});
  } else if (t.dest==='algarve') {
    S({day:days[1]||t.start, start:'10:00', end:'13:00', title:'Passeio de barco às grutas de Benagil', place:'Portimão', e:'🚤', fit:'Ideal para famílias', items:[['Saúde','Comprimidos para o enjoo',''],['Outros','Saco estanque','']]});
    S({day:days[3]||t.start, start:'15:00', end:'18:00', title:'Mini-golfe e passeio na marina', place:'Vilamoura', e:'⛳', items:[]});
  } else {
    S({day:days[Math.min(1,days.length-1)], start:'10:00', end:'12:00', title:'Visita guiada ao centro de '+dname, place:dname, e:'🗺️', items:[['Calçado','Ténis confortáveis',1]]});
    S({day:t.start, start:'19:30', end:'21:30', title:'Jantar típico', place:dname, e:'🍽️', items:[]});
  }
  return ev;
}

function makeTrip(d, profile, history){
  const dest = destById(d.dest);
  const t = {id:uid('t'), dest:d.dest, destName:dest.name, region:dest.region, start:d.start, end:d.end,
    travellers:d.trav, children:d.kids, purpose:d.purpose, acts:[...d.acts]};
  t.items = genItems(t, profile, history);
  t.events = genEvents(t);
  return t;
}

function docStatus(doc, trip){
  if (!doc.expiry) return {k:'bad', label:'Dados em falta'};
  if (diffDays(TODAY_ISO, doc.expiry) < 0) return {k:'bad', label:'Expirado'};
  if (trip && diffDays(trip.end, doc.expiry) < 0) return {k:'warn', label:'Expira durante a viagem'};
  if (diffDays(TODAY_ISO, doc.expiry) < 60) return {k:'warn', label:'Expira em breve'};
  return {k:'ok', label:'Válido'};
}

let toastTimer, undoFn = null;
function toast(msg, o={}){
  const el = document.getElementById('toast');
  undoFn = o.undo || null;
  el.innerHTML = `<div class="toast" role="status"><span class="ti">${o.icon||'✓'}</span><span class="grow">${msg}</span>${o.undo?'<button data-a="undo">Anular</button>':''}${o.action?`<button data-a="${o.action}">${o.actionLabel}</button>`:''}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.innerHTML=''; undoFn=null; }, o.ms||3200);
}
let OV = null;
function openOv(kind, p={}){ OV = {kind, p}; renderOv(); }
function closeOv(silent){ OV = null; if (!silent) renderOv(); }
function renderOv(){
  const el = document.getElementById('ov');
  if (!OV) { el.innerHTML=''; return; }
  const out = OVS[OV.kind](OV.p);
  el.innerHTML = out.modal
    ? `<div class="scrim center" data-a="scrim"><div class="modal" role="dialog" aria-modal="true">${out.html}</div></div>`
    : `<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${out.html}</div></div>`;
  const f = el.querySelector('[autofocus]'); if (f) setTimeout(()=>f.focus(),50);
}

let lastScreen = null;
function render(resetScroll){

  sc.innerHTML = SCREENS[S.screen](S.p);
  sc.scrollTop = keep; lastScreen = S.screen;
  const tb = document.getElementById('tabbar');
  const tabKey = TAB_SCREENS[S.screen] ? S.screen : ({tripnew:null, check:'docs', docform: S.user && S.p.from!=='onb' ? 'docs':null, history:'perfil', item:'mala'}[S.screen]);
  const showTabs = S.user && (TAB_SCREENS[S.screen] || ['check','history','docform'].includes(S.screen)) && !(S.screen==='docform' && S.p.from==='onb');
  tb.style.display = showTabs ? 'flex' : 'none';

    tb.innerHTML = [['home','trip'],['mala','bag'],['agenda','cal'],['docs','doc'],['perfil','user']].map(([k,i]) =>

  }

}

SCREENS.mala = () => {
  const t = trip(); if (!t) return noTrip('a tua mala');
  const f = S.malaFilter;
  const act = t.items.filter(i=>!i.buyLater), packed = act.filter(i=>i.packed).length, later = t.items.filter(i=>i.buyLater);
  let list = '';
  if (f==='comprar') {
    list = later.length ? `<p class="muted mt12">Coisas que ainda não tens. Quando comprares, passa-as para a mala.</p>` + later.map(i=>`
      <div class="item ${S.flash.includes(i.id)?'flash':''}"><span style="font-size:22px;width:32px;text-align:center">🛒</span><div class="grow"><div class="iname">${esc(i.name)}</div><div class="iqty">${esc(i.cat)}${i.qty?' · '+esc(i.qty):''}</div></div>
      <button class="btn btn-sm btn-secondary" data-a="bought" data-id="${i.id}">Já comprei</button></div>`).join('')
      : `<div class="empty"><div class="ee">🛒</div><p class="h-m mt8">Nada para comprar</p><p class="muted small mt4">Abre o menu ⋯ de um item e escolhe «Comprar mais tarde».</p></div>`;
  } else {
    const vis = act.filter(i => f==='todo' || (f==='falta' ? !i.packed : i.packed));
    list = CATS.map(c => {
      const all = act.filter(i=>i.cat===c); const its = vis.filter(i=>i.cat===c); if (!its.length) return '';
      const done = all.filter(i=>i.packed).length; const col = S.collapsed[c];
      return `<div class="cat"><button class="cathead" data-a="collapse" data-c="${c}" aria-expanded="${!col}"><span style="font-size:20px">${CAT_E[c]}</span><span class="ct">${c}</span><span class="badge ${done===all.length?'b-ok':'b-grey'}">${done===all.length?'✓ ':''}${done}/${all.length}</span>${ic(col?'right':'down')}</button>
      ${col?'':its.map(itemRow).join('')}</div>`;
    }).join('') || `<div class="empty"><div class="ee">${f==='falta'?'🎉':'📦'}</div><p class="h-m mt8">${f==='falta'?'Está tudo arrumado!':'Ainda não arrumaste nada'}</p></div>`;
  }
  return `<div class="topbar"><span style="width:8px"></span><h1>Mala · ${esc(t.destName)}</h1></div><div class="pad" style="padding-top:0">
    <div class="card"><div class="row between"><span><b style="font-size:24px">${packed}/${act.length}</b> <span class="muted">itens arrumados</span></span><span class="badge b-sun">${act.length?Math.round(packed/act.length*100):0}%</span></div>
    <div class="progress mt8"><i style="width:${act.length?packed/act.length*100:0}%"></i></div></div>
    <div class="filters mt12">${[['todo','Tudo'],['falta','Por arrumar'],['feito','Arrumados'],['comprar','🛒 Comprar mais tarde'+(later.length?' ('+later.length+')':'')]].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-a="malaFilter" data-v="${k}">${l}</button>`).join('')}</div>
    ${list}
    <button class="fab" data-a="ov" data-k="addItem">${ic('plus')} Adicionar item</button>
  </div>`;
};
const TAGCLS = {rain:'t-rain', hist:'t-hist', new:'t-new'};
function itemRow(i){
  return `<div class="item ${i.packed?'packed':''} ${S.flash.includes(i.id)?'flash':''}">
    <button class="cb ${i.packed?'on':''}" data-a="tick" data-id="${i.id}" role="checkbox" aria-checked="${i.packed}" aria-label="${esc(i.name)}">${i.packed?`<svg viewBox="0 0 24 24">${IC.check}</svg>`:''}</button>
    <div class="grow" data-a="tick" data-id="${i.id}"><div class="iname">${esc(i.name)}</div>${i.qty?`<div class="iqty">${esc(i.qty)}</div>`:''}
    ${i.tags.length?`<div class="tags">${i.tags.map(tg=>`<span class="tag ${TAGCLS[tg.k]||''}">${esc(tg.t)}</span>`).join('')}</div>`:''}</div>
    <button class="iconbtn" data-a="ov" data-k="itemMenu" data-id="${i.id}" aria-label="Mais opções para ${esc(i.name)}">${ic('more')}</button></div>`;
}
const noTrip = what => `<div class="pad"><div class="empty"><div class="ee">🧳</div><p class="h-l mt8">Ainda sem viagem</p><p class="muted mt8">Cria uma viagem para veres ${what}.</p><button class="btn btn-primary mt24" data-a="newTrip">Criar viagem</button></div></div>`;

/* ----- Agenda ----- */
SCREENS.agenda = () => {
  const t = trip(); if (!t) return noTrip('a agenda');
  const days = daysOf(t); if (!S.agDay || !days.includes(S.agDay)) S.agDay = days[0];
  const day = S.agDay, wx = wxForDay(t, day);
  const evs = t.events.filter(e=>e.day===day).sort((a,b)=>a.start.localeCompare(b.start));
  return `<div class="topbar"><span style="width:8px"></span><h1>Agenda · ${esc(t.destName)}</h1></div><div class="pad" style="padding-top:0">
  <div class="days">${days.map(d=>{ const w = wxForDay(t,d); const pend = t.events.some(e=>e.day===d&&e.status==='pending'); return `<button class="day ${d===day?'on':''}" data-a="agDay" data-v="${d}"><div class="dw">${DSEM[D(d).getDay()]}</div><div class="dn">${D(d).getDate()}</div><div class="de">${w?w.e:'·'}${pend?'<span style="color:var(--orange)">•</span>':''}</div></button>`; }).join('')}</div>
  <p class="h-m mt4">${DSEML[D(day).getDay()]}, ${fmt(day)}</p>
  <p class="muted small">${wx?`${wx.e} ${wx.t}, ${wx.min}–${wx.max}°C${wx.rain?' · '+wx.p+'% de probabilidade de chuva':''}`:'Previsão ainda não disponível'}</p>
  ${wx&&wx.rain?`<div class="alert alert-info mt12"><span class="ai">🌧️</span><div class="small"><b>Dia de chuva.</b> Sugerimos atividades em espaços interiores. O casaco impermeável já está na mala.</div></div>`:''}
  <div class="row mt12 small" style="gap:14px;flex-wrap:wrap"><span><span class="badge b-grey" style="border:2px solid var(--ink)">Plano</span></span><span><span class="badge b-warn" style="border:2px dashed var(--orange)">Sugestão</span></span><span><span class="badge b-rain" style="border:2px solid var(--rain)">Pessoal</span></span></div>
  ${evs.length?evs.map(evRow).join(''):`<div class="empty" style="padding:28px 8px"><div class="ee">🌤️</div><p class="h-m mt8">Dia livre</p><p class="muted small mt4">Adiciona um evento teu ou aproveita para descansar.</p></div>`}
  <button class="fab" data-a="ov" data-k="evForm">${ic('plus')} Adicionar evento</button>
</div>`;
};
function evRow(e){
  const t = trip();
  const newCount = e.items.filter(([c,n])=>!t.items.some(i=>i.name===n)).length;
  const cls = e.type==='sug' && e.status==='pending' ? 'sug' : e.type==='own' ? 'own' : 'plan';
  return `<div class="ev ${S.flash.includes(e.id)?'flash':''}"><div class="time">${e.start}<small>${e.end}</small></div><div class="evc ${cls}">
   ${cls==='sug'?`<span class="badge b-warn">✨ Sugestão</span>`:e.type==='sug'?`<span class="badge b-ok">✓ Sugestão aceite</span>`:e.type==='own'?`<span class="badge b-rain">Pessoal</span>`:`<span class="badge b-grey">Plano da viagem</span>`}
   ${e.overlap?` <span class="badge b-err">⚠ Sobreposto</span>`:''}
   <div class="row" style="align-items:flex-start;margin-top:6px"><div class="grow"><div class="et">${e.e||'📍'} ${esc(e.title)}</div>${e.place?`<div class="ep">📍 ${esc(e.place)}</div>`:''}${e.fit?`<div class="ep">${esc(e.fit)}</div>`:''}</div>
   ${cls!=='sug'?`<button class="iconbtn" style="margin:-8px -8px 0 0" data-a="ov" data-k="evMenu" data-id="${e.id}" aria-label="Opções">${ic('more')}</button>`:''}</div>
   ${cls==='sug'?`${newCount?`<p class="small mt8" style="font-weight:700">🧳 Junta ${newCount} ${newCount>1?'itens':'item'} à mala</p>`:''}
     <div class="eacts"><button class="btn btn-sm btn-primary" data-a="accept" data-id="${e.id}">${ic('check')} Aceitar</button><button class="btn btn-sm btn-secondary" data-a="ov" data-k="move" data-id="${e.id}">Mover</button><button class="btn btn-sm btn-secondary" data-a="rejectSug" data-id="${e.id}">Remover</button></div>`:''}
  </div></div>`;
}

/* ----- Documentos ----- */
SCREENS.docs = () => {
  const t = trip();
  return `<div class="topbar"><span style="width:8px"></span><h1>Documentos</h1></div><div class="pad" style="padding-top:0">
  ${t?`<div class="card" style="background:var(--sun-100);border-color:var(--sun-200)"><p class="h-m">Vais viajar para ${esc(t.destName)}?</p><p class="small muted mt4">Confirma que os teus documentos são válidos até ${fmt(t.end)}.</p><button class="btn btn-primary mt12" data-a="runCheck">🔍 Verificar documentos para a viagem</button></div>`:''}
  <p class="h-s mt24">Os meus documentos</p>
  <div class="stack mt8">${S.docs.length?S.docs.map(docCard).join(''):'<p class="muted">Ainda não adicionaste documentos.</p>'}</div>
  <div class="stack mt16">${Object.entries(DOC_TYPES).filter(([k])=>!S.docs.some(d=>d.type===k)).map(([k,v])=>`<button class="btn btn-secondary" style="justify-content:flex-start" data-a="newDoc" data-t="${k}">${ic('plus')} ${v.e} Adicionar ${v.label.toLowerCase()}</button>`).join('')}</div>
</div>`;
};

SCREENS.check = (p) => {
  const t = trip();
  if (!p.done) return `${topbar('Verificação de documentos')}<div class="pad" style="text-align:center;padding-top:80px"><div class="spinner"></div><p class="h-m mt24">A verificar os teus documentos…</p><p class="muted mt8">Viagem a ${esc(t.destName)}, ${fmtRange(t.start,t.end)}</p></div>`;
  const dest = destById(t.dest)||{};
  const ids = S.docs.filter(d=>d.type==='cc'||d.type==='pass');
  const validId = ids.find(d=>docStatus(d,t).k==='ok');
  const rows = [];
  ids.forEach(d => { const st = docStatus(d,t); const T = DOC_TYPES[d.type];
    rows.push(`<div class="check-row"><span class="ci ${st.k==='ok'?'ok':st.k==='warn'?'warn':'bad'}">${st.k==='ok'?'✓':'!'}</span><div class="grow"><b>${T.label}</b> <span class="badge b-${st.k==='ok'?'ok':st.k==='warn'?'warn':'err'}">${st.label}</span>
      <p class="small muted mt4">${st.k==='ok'?'Válido até '+fmtY(d.expiry)+'. Serve como identificação '+(dest.air?'no voo':'durante a viagem')+'.':st.label==='Expirado'?'Expirou a <b>'+fmtY(d.expiry)+'</b>. Não é aceite como identificação '+(dest.air?'no embarque':'')+'.':'Expira a '+fmtY(d.expiry)+', antes do regresso.'}</p>
      ${st.k!=='ok'?`<div class="row mt12" style="flex-wrap:wrap"><button class="btn btn-sm btn-primary" data-a="ov" data-k="howto" data-id="${d.id}">❓ Como resolver?</button><button class="btn btn-sm btn-secondary" data-a="editDoc" data-id="${d.id}" data-fc="1">Atualizar dados</button></div>`:''}</div></div>`); });
  if (!ids.length) rows.push(`<div class="check-row"><span class="ci bad">!</span><div class="grow"><b>Documento de identificação</b><p class="small muted mt4">Não tens nenhum Cartão de Cidadão ou passaporte guardado.</p><button class="btn btn-sm btn-primary mt12" data-a="newDoc" data-t="cc">Adicionar documento</button></div></div>`);
  if (!S.docs.some(d=>d.type==='pass')) rows.push(`<div class="check-row"><span class="ci na">–</span><div class="grow"><b>Passaporte</b><p class="small muted mt4">${dest.abroad?'Recomendado para viagens ao estrangeiro.':'Não é necessário para esta viagem (nacional).'}</p></div></div>`);
  S.docs.filter(d=>d.type==='carta').forEach(d => { const st = docStatus(d,t); rows.push(`<div class="check-row"><span class="ci ${st.k==='ok'?'ok':'warn'}">${st.k==='ok'?'✓':'!'}</span><div class="grow"><b>Carta de condução</b> <span class="badge b-${st.k==='ok'?'ok':'warn'}">${st.label}</span><p class="small muted mt4">Opcional — útil se alugares carro. ${st.k==='ok'?'Válida até '+fmtY(d.expiry)+'.':''}</p></div></div>`); });
  return `${topbar('Verificação de documentos')}<div class="pad">
   <p class="muted" style="font-weight:700">Viagem a ${esc(t.destName)} · ${fmtRange(t.start,t.end)}</p>
   ${validId?`<div class="alert alert-ok mt12"><span class="ai">✅</span><div><b>Tudo pronto para viajar!</b><p class="small mt4">Tens um documento de identificação válido para esta viagem.</p></div></div>`
     :`<div class="alert alert-err mt12"><span class="ai">⛔</span><div><b>Atenção: não tens um documento de identificação válido</b><p class="small mt4">Sem um documento válido podes não conseguir embarcar. Resolve antes de ${fmt(t.start)}.</p></div></div>`}
   <div class="card mt16" style="padding:4px 16px">${rows.join('')}</div>
   <button class="btn btn-secondary mt16" data-a="runCheck">Verificar outra vez</button>
  </div>`;
};

/* ----- Perfil & histórico ----- */
SCREENS.perfil = () => { const pr = S.profile; return `<div class="topbar"><span style="width:8px"></span><h1>Perfil</h1></div><div class="pad" style="padding-top:0">
  <div class="row"><span class="avatar">${esc((pr.name||S.user.name||'?').split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div><p class="h-m">${esc(pr.name||S.user.name)}</p><p class="small muted">${esc(S.user.email)}</p></div></div>
  <p class="h-s mt24">Preferências da lista</p>

  </div>
  <p class="small muted mt24" style="text-align:center">Pack&amp;Sun · protótipo v0.1</p>
</div>`; };

SCREENS.history = () => `${topbar('Histórico de viagens')}<div class="pad">
  ${S.history.length?`<div class="insight"><p>🕘 <b>Com base nas tuas viagens anteriores…</b></p>
    <ul class="small mt8" style="padding-left:18px;line-height:1.6"><li>Esqueceste o <b>carregador do telemóvel</b> em 2 de 3 viagens — agora aparece sempre como essencial.</li><li>Em Sevilha levaste calças a mais — sugerimos menos peças.</li><li>Levas sempre <b>medicação</b> — já faz parte de todas as listas.</li></ul></div>
  <p class="h-s mt24">Viagens anteriores</p>
  <div class="stack mt8">${S.history.map(h=>`<button class="card tap" data-a="ov" data-k="histDetail" data-id="${h.id}"><div class="row between"><span class="h-m">${h.e} ${h.dest}</span>${ic('right')}</div>
    <p class="small muted">${fmtRange(h.start,h.end)} ${D(h.start).getFullYear()} · ${h.purpose==='lazer'?'Lazer':'Trabalho'} · ${h.trav} ${h.trav>1?'pessoas':'pessoa'}</p>
    <p class="small mt8">${h.items} itens · <span style="color:var(--err);font-weight:800">esqueceste ${h.forgot.length}</span></p></button>`).join('')}</div>`
  :`<div class="empty"><div class="ee">🕘</div><p class="h-m mt8">Ainda sem viagens anteriores</p><p class="muted mt8">Depois da tua primeira viagem, a lista começa a aprender contigo: o que esqueceste e o que não usaste.</p></div>`}
</div>`;

OVS.tripSwitch = () => ({html:`<p class="h-l">As tuas viagens</p><div class="stack mt16">${S.trips.slice().sort((a,b)=>a.start.localeCompare(b.start)).map(t=>{ const a=t.items.filter(i=>!i.buyLater); const p=a.filter(i=>i.packed).length; return `<button class="card tap" style="${t.id===S.cur?'border:2px solid var(--ink);background:var(--sun-100)':''}" data-a="switchTrip" data-id="${t.id}">
  <div class="row between"><b>${esc(t.destName)}</b>${t.id===S.cur?'<span class="badge b-sun">Atual</span>':''}</div><p class="small muted">${fmtRange(t.start,t.end)} · ${t.travellers} ${t.travellers>1?'pessoas':'pessoa'} · ${t.purpose==='lazer'?'Lazer':'Trabalho'}</p>
  <div class="progress mt8" style="height:8px"><i style="width:${a.length?p/a.length*100:0}%"></i></div><p class="small muted mt4">${p}/${a.length} itens</p></button>`; }).join('')}</div>

OVS.addItem = (p) => ({html:`<p class="h-l">Adicionar item</p>

OVS.overlap = ({a, b, pending}) => ({modal:true, html:`<div style="text-align:center"><div style="font-size:40px">⚠️</div><p class="h-l mt8">Eventos sobrepostos</p></div>

  <button class="btn btn-primary mt24" data-a="saveEv">Adicionar à agenda</button>`}; };

OVS.howto = ({id}) => { const d = S.docs.find(x=>x.id===id); const T = DOC_TYPES[d.type]; const t = trip();
  return {html:`<p class="h-l">Como resolver?</p><p class="muted mt4">O teu ${T.label} ${docStatus(d,t).label==='Expirado'?'expirou a '+fmtY(d.expiry):'expira antes do regresso'}. Faltam ${diffDays(TODAY_ISO,t.start)} dias para a viagem.</p>
  <ol class="howto mt8">
   <li><span><b>Pede a renovação já.</b> Podes fazê-lo online no portal ePortugal (com Chave Móvel Digital) ou marcar atendimento num balcão do IRN / Espaço Cidadão.</span></li>
   <li><span><b>Pede o serviço urgente</b>, se estiver disponível, para teres o cartão antes de ${fmt(t.start)}.</span></li>
   <li><span><b>Se não ficar pronto a tempo</b>, contacta a companhia aérea para saber que documento alternativo aceitam (por exemplo, um passaporte válido).</span></li>
   <li><span><b>Quando receberes o novo cartão</b>, atualiza aqui o número e a validade para voltarmos a verificar.</span></li>
  </ol>
  <div class="alert alert-info mt16"><span class="ai">ℹ️</span><div class="small">Informação geral. Confirma sempre os requisitos junto das entidades oficiais e da tua companhia aérea.</div></div>
  <button class="btn btn-primary mt16" data-a="editDoc" data-id="${d.id}" data-fc="1">Atualizar dados do documento</button>
  <button class="btn btn-secondary mt12" data-a="remind">⏰ Lembrar-me amanhã</button>`}; };

OVS.histDetail = ({id}) => { const h = S.history.find(x=>x.id===id); return {html:`<p class="h-l">${h.e} ${h.dest}</p><p class="small muted">${fmtRange(h.start,h.end)} ${D(h.start).getFullYear()} · ${h.region}</p>
  <div class="card mt16"><p style="font-weight:800">😬 Esqueceste</p><ul class="mt4" style="padding-left:20px">${h.forgot.map(x=>`<li>${x}</li>`).join('')}</ul>
  <p style="font-weight:800" class="mt12">📦 Levaste e não usaste</p><ul class="mt4" style="padding-left:20px">${h.unused.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <p class="small muted mt12">A Pack&amp;Sun usa isto para ajustar as próximas listas.</p>
  <button class="btn btn-primary mt16" data-a="reuse" data-id="${h.id}">Usar como base para nova viagem</button>`}; };

/* ---------- actions ---------- */
const $ = id => document.getElementById(id);
const A = {};
A.go = el => go(el.dataset.s, {}, {replace: !!el.dataset.r});
A.back = () => back();
A.tab = el => { if (el.dataset.s==='mala') S.malaFilter = S.malaFilter==='comprar'?'comprar':S.malaFilter; go(el.dataset.s); };
A.closeOv = () => closeOv();
A.scrim = (el, ev) => { if (ev.target===el) closeOv(); };
A.ov = el => openOv(el.dataset.k, {...el.dataset});
A.undo = () => { if (undoFn) { undoFn(); undoFn=null; $('toast').innerHTML=''; } };

const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
A.doLogin = () => { const email = $('le').value.trim(), pw = $('lp').value;
  if (!email || !pw) return go('login', {email, err:'Preenche o email e a palavra-passe.', errE:!email, errP:!pw}, {replace:true});
  if (!isEmail(email)) return go('login', {email, err:'O email não parece válido. Ex.: nome@email.pt', errE:true}, {replace:true});
  seedAna(); S.stack=[]; go('home'); toast('Bem-vinda de volta, Ana!', {icon:'👋'}); };
A.loginWith = () => go('login', {email:S.p.email}, {replace:true});
A.forgot = () => toast('Enviámos um email para recuperares a palavra-passe.', {icon:'✉️'});
A.doRegister = () => { const name = $('rn').value.trim(), email = $('re').value.trim(), pw = $('rp').value; const e = {};
  if (!name) e.n = 'Escreve o teu nome.'; if (!isEmail(email)) e.e = email?'O email não parece válido. Ex.: nome@email.pt':'Escreve o teu email.'; if (pw.length<8) e.p = 'A palavra-passe tem de ter pelo menos 8 caracteres.';
  if (Object.keys(e).length) return go('register', {name, email, e}, {replace:true});
  if (norm(email)==='ana.silva@email.pt') return go('register', {name, email, exists:true}, {replace:true});
  S.user = {name, email}; S.profile.name = name; go('profile', {}, {replace:true}); toast('Conta criada', {icon:'✓'}); };
A.setWith = el => { S.profile.with = el.dataset.v; render(); };
A.toggleProf = el => { const k = el.dataset.k; S.profile[k] = !S.profile[k]; render(); if (S.screen==='perfil') toast(S.profile[k]?'Vamos incluir isto nas próximas listas':'Removido das próximas listas'); };
A.newDoc = el => go('docform', {type:el.dataset.t, from:el.dataset.from||''});
A.editDoc = el => { const d = S.docs.find(x=>x.id===el.dataset.id); closeOv(true); go('docform', {type:d.type, id:d.id, fromCheck:!!el.dataset.fc}); };
A.saveDoc = () => { const p = S.p, T = DOC_TYPES[p.type]; const v = {name:$('dn').value.trim(), number:$('dnum').value.trim().toUpperCase(), expiry:$('dexp').value}; const e = {};
  if (!v.name) e.name = 'Escreve o nome como aparece no documento.';
  if (!v.number) e.number = 'O número do documento é obrigatório.'; else if (!T.re.test(v.number)) e.number = 'Número inválido. Formato: '+T.fmt+'.';
  if (!v.expiry) e.expiry = 'Indica a data de validade.';
  if (Object.keys(e).length) { S.p = {...p, vals:v, e, warnPast:false}; return render(); }
  const past = diffDays(TODAY_ISO, v.expiry) < 0;
  if (past && !p.warnPast) { S.p = {...p, vals:v, e:{}, warnPast:true}; return render(); }
  if (p.id) Object.assign(S.docs.find(x=>x.id===p.id), v); else S.docs.push({id:uid('d'), type:p.type, ...v});
  const wasCheck = p.fromCheck;
  back();
  if (wasCheck) { S.screen='check'; S.p={done:true}; render(true); }
  toast(past?'Documento guardado — está expirado':'Documento guardado', {icon: past?'⚠️':'✓'}); };
A.delDoc = () => { const d = S.docs.find(x=>x.id===S.p.id); S.docs = S.docs.filter(x=>x!==d); back(); toast('Documento removido', {icon:'🗑️', undo:()=>{ S.docs.push(d); render(); }}); };
A.finishOnb = () => { S.stack=[]; go('home'); toast('Perfil pronto! Bem-vindo/a, '+esc(S.profile.name.split(' ')[0])+'.', {icon:'🎉'}); };

A.newTrip = () => { S.draft = {q:'', dest:null, start:'', end:'', trav:1, kids:0, purpose:'lazer', acts:[], e:{}}; S.step=1; closeOv(true); go('tripnew'); };
A.pickDest = el => { const d = destById(el.dataset.v); S.draft.dest = d.id; S.draft.q = d.name+', '+d.region; S.draft.e = {...S.draft.e, dest:null}; render(); };
A.tripNext = () => { const d = S.draft; const e = {};
  if (S.step===1) {
    if (!d.dest) { const r = DEST.filter(x => norm(x.name)===norm(d.q) || (x.alias||'').split(' ').includes(norm(d.q))); if (r.length===1) { d.dest=r[0].id; d.q=r[0].name+', '+r[0].region; } }
    if (!d.q.trim()) e.dest = 'Escreve para onde vais.';
    else if (!d.dest) e.dest = `Não encontrámos «${esc(d.q.trim())}». Verifica o nome ou escolhe uma das sugestões enquanto escreves.`;
    if (!d.start || !d.end) e.dates = 'Indica a data de ida e a data de regresso.';
    else if (diffDays(d.end, d.start) > 0) e.dates = `A data de regresso (${fmt(d.end)}) é anterior à data de ida (${fmt(d.start)}).`;
    else if (diffDays(TODAY_ISO, d.start) < 0) e.dates = `A data de ida (${fmtY(d.start)}) já passou.`;
    d.e = e; if (Object.keys(e).length) return render();
    S.step = 2; return render(true);
  }
  if (S.step===2) { S.step = 3; return render(true); }
  // step 3 -> generate
  const dn = destById(d.dest).name; const fcAvail = diffDays(TODAY_ISO, d.start) <= 10;
  const lines = [fcAvail?`☀️ A ver a previsão para ${dn}…`:`🗓️ A usar o clima típico de ${dn}…`, d.acts.length?`🎒 A juntar o que precisas para ${d.acts.map(a=>ACTS[a].label.toLowerCase()).join(', ')}…`:'🎒 A juntar o essencial…', S.history.length?'🕘 A aprender com as tuas viagens anteriores…':'👤 A usar o teu perfil…'];
  S.stack=[]; S.screen='generating'; S.p={lines:[]}; render(true);
  lines.forEach((l,i)=>setTimeout(()=>{ S.p.lines.push(l); if (S.screen==='generating') render(); }, 350+i*450));
  setTimeout(()=>{ const t = makeTrip(d, S.profile, S.history); S.trips.push(t); S.cur = t.id; S.agDay=null; S.malaFilter='todo'; go('home'); toast(`Viagem criada · lista com ${t.items.length} itens`, {icon:'🧳', action:'gotoMala', actionLabel:'Ver mala'}); }, 1900);
};
A.tripPrev = () => { S.step--; render(true); };
A.step = el => { const d = S.draft, k = el.dataset.k, v = d[k] + Number(el.dataset.d); if (k==='trav') { d.trav = Math.max(1, Math.min(12, v)); d.kids = Math.min(d.kids, d.trav-1); } else d.kids = Math.max(0, Math.min(d.trav-1, v)); render(); if (k==='kids' && v>d.kids) toast('Pelo menos 1 adulto tem de viajar', {icon:'ℹ️'}); };
A.purpose = el => { S.draft.purpose = el.dataset.v; render(); };
A.act = el => { const a = S.draft.acts, v = el.dataset.v; S.draft.acts = a.includes(v) ? a.filter(x=>x!==v) : [...a, v]; render(); };
A.switchTrip = el => { S.cur = el.dataset.id; S.agDay=null; closeOv(true); go('home'); toast('A ver a viagem a '+esc(trip().destName)); };
A.gotoMala = () => { $('toast').innerHTML=''; go('mala'); };

/* mala */
A.malaFilter = el => { S.malaFilter = el.dataset.v; render(); };
A.collapse = el => { S.collapsed[el.dataset.c] = !S.collapsed[el.dataset.c]; render(); };
A.tick = el => { const t = trip(); const i = t.items.find(x=>x.id===el.dataset.id); i.packed = !i.packed; i.tags = i.tags.filter(g=>g.k!=='new');
  if (el.dataset.close) closeOv(true);
  render();
  const act = t.items.filter(x=>!x.buyLater); const cat = act.filter(x=>x.cat===i.cat);
  if (i.packed && act.every(x=>x.packed)) openOv('allDone');
  else if (i.packed && cat.every(x=>x.packed)) toast(`${CAT_E[i.cat]} ${i.cat}: tudo arrumado!`);
};
OVS.allDone = () => ({modal:true, html:`<div style="text-align:center"><img src="${LOGO}" alt="" style="width:110px"><p class="h-l mt8">Mala pronta!</p><p class="muted mt8">Arrumaste todos os itens. Boa viagem! ☀️</p>${trip().items.some(i=>i.buyLater)?`<p class="small mt12">Não te esqueças: tens itens para comprar mais tarde.</p>`:''}<button class="btn btn-primary mt16" data-a="closeOv">Fechar</button></div>`});
A.buyLater = el => { const i = trip().items.find(x=>x.id===el.dataset.id); i.buyLater = !i.buyLater; if (i.buyLater) i.packed=false; closeOv(true); render();
  toast(i.buyLater?`«${esc(i.name)}» passou para «Comprar mais tarde»`:`«${esc(i.name)}» voltou para a mala`, {icon:'🛒', undo:()=>{ i.buyLater=!i.buyLater; render(); }}); };
A.bought = el => { const i = trip().items.find(x=>x.id===el.dataset.id); i.buyLater=false; i.packed=false; S.flash=[i.id]; render(); toast(`«${esc(i.name)}» comprado — já está na mala para arrumar`, {icon:'🧳'}); };
A.delItem = el => { const t = trip(); const idx = t.items.findIndex(x=>x.id===el.dataset.id); const [i] = t.items.splice(idx,1); closeOv(true); render(); toast(`«${esc(i.name)}» removido`, {icon:'🗑️', undo:()=>{ t.items.splice(idx,0,i); render(); }}); };
A.aiCat = el => { OV.p = {...OV.p, ...readAdd(), cat:el.dataset.v}; renderOv(); };
A.aiLater = () => { OV.p = {...OV.p, ...readAdd(), later:!OV.p.later}; renderOv(); };
const readAdd = () => ({name:$('ain').value, qty:$('aiq').value});
A.saveItem = () => { const p = {...OV.p, ...readAdd()}; const name = p.name.trim(); const t = trip();
  if (!name) { OV.p = {...p, err:'Escreve o nome do item.'}; return renderOv(); }
  if (t.items.some(i=>norm(i.name)===norm(name))) { OV.p = {...p, err:`Já tens «${esc(name)}» na lista.`}; return renderOv(); }
  const it = {id:uid('i'), cat:p.cat||'Outros', name, qty:p.qty.trim(), tags:[{k:'act',t:'✍️ adicionado por ti'}], packed:false, buyLater:!!p.later};
  t.items.push(it); S.flash=[it.id]; if (it.buyLater && S.malaFilter!=='comprar') {} closeOv(true); render();
  toast(it.buyLater?`«${esc(name)}» adicionado a «Comprar mais tarde»`:`«${esc(name)}» adicionado a ${it.cat}`, {icon:it.buyLater?'🛒':'✓', undo:()=>{ t.items = t.items.filter(x=>x!==it); render(); }}); };

/* agenda */
A.agDay = el => { S.agDay = el.dataset.v; render(); };
function findOverlap(t, ev, day, start, end){
  return t.events.find(o => o.id!==ev.id && o.status!=='pending' && o.day===day && toMin(start) < toMin(o.end) && toMin(o.start) < toMin(end));
}
let pendingOp = null;
A.accept = el => { const t = trip(); const e = t.events.find(x=>x.id===el.dataset.id);
  const o = findOverlap(t, e, e.day, e.start, e.end);
  if (o) { pendingOp = {kind:'accept', id:e.id}; return openOv('overlap', {a:e, b:o}); }
  doAccept(e); };
function doAccept(e, overlap){
  const t = trip(); e.status='ok'; if (overlap) e.overlap = true;
  const added = [];
  e.items.forEach(([cat,name,q]) => { if (t.items.some(i=>i.name===name)) return; const it = {id:uid('i'), cat, name, qty:qtyTxt(t,q), tags:[{k:'act',t:(e.e||'')+' '+e.title.split(':')[0].split(' ').slice(0,3).join(' ').toLowerCase()},{k:'new',t:'NOVO'}], packed:false, buyLater:false}; t.items.push(it); added.push(it); });
  S.flash = [e.id, ...added.map(i=>i.id)]; render();
  if (added.length) openOv('accepted', {ev:e, added}); else toast('Atividade adicionada · não precisas de itens novos', {icon:'📅'});
}
A.seeNew = () => { closeOv(true); S.malaFilter='todo'; S.collapsed={}; go('mala'); setTimeout(()=>{ const f = document.querySelector('.item.flash'); if (f) f.scrollIntoView({block:'center', behavior:'smooth'}); }, 80); };
A.rejectSug = el => { const t = trip(); const idx = t.events.findIndex(x=>x.id===el.dataset.id); const [e] = t.events.splice(idx,1); render(); toast('Sugestão removida', {icon:'🗑️', undo:()=>{ t.events.splice(idx,0,e); render(); }}); };
A.delEv = el => { const t = trip(); const idx = t.events.findIndex(x=>x.id===el.dataset.id); const [e] = t.events.splice(idx,1); closeOv(true); render(); toast('Evento removido', {icon:'🗑️', undo:()=>{ t.events.splice(idx,0,e); render(); }}); };
A.mvDay = el => { OV.p = {...OV.p, day:el.dataset.v, start:$('mvs').value}; renderOv(); };
A.saveMove = () => { const t = trip(); const e = t.events.find(x=>x.id===OV.p.id); const day = OV.p.day||e.day; const start = $('mvs').value || e.start; const dur = toMin(e.end)-toMin(e.start);
  const end = fromMin(Math.min(toMin(start)+dur, 23*60+59));
  const o = findOverlap(t, e, day, start, end);
  if (o) { pendingOp = {kind:'move', id:e.id, day, start, end}; return openOv('overlap', {a:{...e, start, end, day}, b:o}); }
  applyMove(e, day, start, end); };
function applyMove(e, day, start, end, overlap){ e.day=day; e.start=start; e.end=end; e.overlap=!!overlap; S.agDay=day; S.flash=[e.id]; closeOv(true); render(); toast(`Movido para ${DSEM[D(day).getDay()]} ${fmt(day)}, ${start}`, {icon:'↔️'}); }
A.efDay = el => { OV.p = {...OV.p, v:{...readEv(), day:el.dataset.v}}; renderOv(); };
const readEv = () => ({title:$('eft').value, start:$('efs').value, end:$('efe').value, place:$('efp').value, day:(OV.p.v||{}).day||S.agDay});
A.saveEv = () => { const t = trip(); const v = readEv(); const e = {};
  if (!v.title.trim()) e.title = 'Dá um nome ao evento.';
  if (!v.start || !v.end) e.time = 'Indica a hora de início e de fim.'; else if (toMin(v.end) <= toMin(v.start)) e.time = 'A hora de fim tem de ser depois da hora de início.';
  if (Object.keys(e).length) { OV.p = {v, e}; return renderOv(); }
  const ev = {id:uid('e'), type:'own', status:'ok', items:[], day:v.day, start:v.start, end:v.end, title:v.title.trim(), place:v.place.trim(), e:'📌'};
  const o = findOverlap(t, ev, ev.day, ev.start, ev.end);
  if (o) { pendingOp = {kind:'new', ev}; return openOv('overlap', {a:ev, b:o}); }
  addOwn(ev); };
function addOwn(ev, overlap){ const t = trip(); ev.overlap=!!overlap; t.events.push(ev); S.agDay=ev.day; S.flash=[ev.id]; closeOv(true); render(); toast('Evento adicionado à agenda', {icon:'📅'}); }
A.overlapKeep = () => { const op = pendingOp; pendingOp=null; const t = trip();
  if (op.kind==='accept') { closeOv(true); doAccept(t.events.find(x=>x.id===op.id), true); }
  else if (op.kind==='move') applyMove(t.events.find(x=>x.id===op.id), op.day, op.start, op.end, true);
  else addOwn(op.ev, true); };
A.overlapChange = () => { const op = pendingOp; pendingOp=null;
  if (op.kind==='new') openOv('evForm', {v:{...op.ev}, e:{time:'Escolhe outra hora para não sobrepor.'}});
  else openOv('move', {id:op.id, day:op.day}); };

/* docs */
A.runCheck = () => { closeOv(true); if (S.screen==='check') { S.p={}; render(true); } else go('check', {}); setTimeout(()=>{ if (S.screen==='check') { S.p={done:true}; render(true); } }, 1100); };
A.remind = () => { closeOv(); toast('Vamos lembrar-te amanhã às 9:00', {icon:'⏰'}); };
A.logout = () => { S = freshState(); go('splash'); toast('Sessão terminada'); };
A.reuse = () => { closeOv(true); A.newTrip(); toast('Vamos usar a lista dessa viagem como base', {icon:'🕘'}); };

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (fn) { if (el.dataset.a!=='scrim') ev.stopPropagation(); fn(el, ev); }
});
document.addEventListener('input', ev => {
  const el = ev.target; const b = el.dataset && el.dataset.bind; if (!b) return;
  const [o,k] = b.split('.'); S[o][k] = el.value;
  if (el.dataset.ac) { S.draft.dest = null; $('ac').innerHTML = acHtml(); }
});
document.addEventListener('keydown', ev => { if (ev.key==='Escape' && OV) closeOv(); });

/* ---------- facilitator panel ---------- */
function ensureMadeira(){
  if (!S.user) seedAna();
  let t = S.trips.find(x=>x.dest==='funchal');
  if (!t) { t = makeTrip({dest:'funchal', start:'2026-10-12', end:'2026-10-16', trav:2, kids:0, purpose:'lazer', acts:['caminhada','praia','jantar']}, S.profile, S.history); S.trips.push(t); }
  S.cur = t.id; return t;
}
const TASKS = [
  ['T1','Criar conta, perfil e documentos','Registo → perfil → documentos. Testar email já registado e documento com dados inválidos.', ()=>{ S=freshState(); go('splash'); }],
  ['T2','Criar a viagem à Madeira','Funchal, 12–16 out, 2 pessoas, lazer; caminhada, praia, jantar. Testar destino inexistente e datas trocadas.', ()=>{ S=freshState(); seedAna(); go('home'); A.newTrip(); }],
  ['T3','Fazer a mala','Marcar itens, adicionar um item extra, pôr um item em «comprar mais tarde».', ()=>{ ensureMadeira(); S.malaFilter='todo'; go('mala'); }],
  ['T4','Planear a agenda','Aceitar o passeio de barco (12 out) e ver os itens novos na mala. Testar evento sobreposto (ex.: 13 out, 10:00–11:00).', ()=>{ ensureMadeira(); S.agDay='2026-10-12'; go('agenda'); }],
  ['T5','Verificar documentos','Ver o CC expirado → «Como resolver?» → atualizar a validade.', ()=>{ ensureMadeira(); const cc = S.docs.find(d=>d.type==='cc'); if (cc) cc.expiry='2026-09-14'; go('docs'); }],
  ['T6','Ver o histórico','Perfil → Histórico de viagens.', ()=>{ if(!S.user) seedAna(); go('perfil'); }],
];
function renderPanel(){
  const el = $('panel'); if (!el || el.dataset.ok) return; el.dataset.ok = 1;
  el.innerHTML = `<div class="logo"><img src="${ICON}" alt=""><div><h2>Pack&amp;Sun · protótipo</h2><span class="small muted">Painel do facilitador (não aparece no telemóvel)</span></div></div>
  ${TASKS.map((t,i)=>`<div class="pt"><div class="grow"><b>${t[0]} · ${t[1]}</b><span>${t[2]}</span></div><button class="go" data-a="task" data-i="${i}">Ir</button></div>`).join('')}
  <p class="small mt12"><b>Dados de teste</b></p><p class="small muted mt4" style="line-height:1.5">Hoje (simulado): 7 out 2026 · Conta existente: <b>ana.silva@email.pt</b> (qualquer palavra-passe) · Destino inexistente: «Atlântida» · CC válido: <b>12345678 9 ZX4</b></p>
  <button class="reset" data-a="task" data-i="0">↺ Recomeçar do início</button>`;
}
A.task = el => { closeOv(true); $('toast').innerHTML=''; TASKS[+el.dataset.i][3](); };

render(true);

</script></body></html>
